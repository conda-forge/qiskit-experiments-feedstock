schema_version: 1

context:
  version: "0.14.0"

package:
  name: qiskit-experiments
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/q/qiskit-experiments/qiskit_experiments-${{ version }}.tar.gz
  sha256: ec97aa64bdef89ff4bcd34a80d05b6cdc14dad5c75d710991a58be92f465b66a

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77.0
    - setuptools-scm
    - pip
  run:
    - python >=${{ python_min }}
    - numpy >=1.17
    - scipy >=1.4
    - qiskit >=1.3
    - qiskit-ibm-runtime >=0.34.0
    - matplotlib-base >=3.4
    - uncertainties
    - lmfit
    - rustworkx
    - pandas >=1.1.5
    - packaging

tests:
  - python:
      imports:
        - qiskit_experiments
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Software for developing quantum computing programs
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/Qiskit-Community/qiskit-experiments
  documentation: https://qiskit-community.github.io/qiskit-experiments

extra:
  recipe-maintainers:
    - wshanks
    - BastianZim
